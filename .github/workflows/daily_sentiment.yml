# Daily news -> FinBERT sentiment for wrsi_trader_new's Nifty 500 universe.
# Writes sentiment_gate/sentiment_<date>.csv into nangiasachin27/wrsi_trader_new.
#
# One-time setup (news_scraper repo -> Settings -> Secrets and variables -> Actions):
#   WRSI_PUSH_TOKEN  fine-grained PAT, repository access: wrsi_trader_new only,
#                    permissions: Contents = Read and write
#
# Timing: the row for day T uses news known before 15:15 IST and the scraper window closes
# at 15:30, so this starts at 15:35 IST. A full Nifty 500 run takes roughly 45-90 minutes
# (Google is rate-limited to ~1 query/s), so wrsi's eod must run AFTER it - see the README.
# GitHub's cron can start 10-30 minutes late; the filter fails open if the CSV isn't there.
name: daily-sentiment
on:
  schedule:
    - cron: "5 10 * * 1-5"   # 15:35 IST, Mon-Fri (holidays exit early)
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (default: today in IST)"
        required: false
      extra:
        description: "extra run_pipeline options, e.g. --workers 4"
        required: false
concurrency: {group: daily-sentiment, cancel-in-progress: false}
permissions: {contents: read}
env:
  TZ: Asia/Kolkata
  HF_HUB_DISABLE_TELEMETRY: "1"
jobs:
  sentiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: nangiasachin27/wrsi_trader_new
          token: ${{ secrets.WRSI_PUSH_TOKEN }}
          path: wrsi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-sentiment.txt pandas numpy

      # FinBERT weights (~440 MB) and the NSE/BSE symbol lists, so each run doesn't re-download them.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1
      - uses: actions/cache@v4
        with:
          path: data/reference
          key: reference-${{ github.run_id }}
          restore-keys: reference-

      - name: Scrape, score, export
        env:
          DATE_IN: ${{ inputs.date }}
          EXTRA: ${{ inputs.extra }}
        run: |
          ARGS=(); if [ -n "$DATE_IN" ]; then ARGS+=(--date "$DATE_IN"); fi
          python daily_sentiment.py "${ARGS[@]}" \
            --wrsi-universe wrsi/config/universe.json --list nifty500 \
            --out-dir wrsi/sentiment_gate \
            -- --workers 4 --log-file logs/daily.log $EXTRA

      - name: Commit CSV to wrsi_trader_new
        working-directory: wrsi
        run: |
          git config user.name "sentiment-bot"
          git config user.email "sentiment-bot@users.noreply.github.com"
          git add sentiment_gate
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "sentiment $(ls -t sentiment_gate/sentiment_*.csv | head -1 | sed 's/.*sentiment_//; s/.csv//')"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 10)); done
          exit 1

      # Raw news + per-ticker sentiment for debugging or later re-scoring (kept 90 days).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentiment-${{ github.run_id }}
          path: |
            data/news
            data/sentiment
            logs
          retention-days: 90
          if-no-files-found: ignore
