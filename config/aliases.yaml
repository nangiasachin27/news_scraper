# Manual overrides layered on top of names derived from the NSE/BSE reference lists.
#
#   aliases:          case-insensitive phrases that identify the company in news text
#   strict_aliases:   case-sensitive tokens (acronyms that collide with ordinary words)
#   exclude_terms:    masked out BEFORE matching - group/sibling listed entities
#   ambiguous_aliases: strict aliases other entities also use (RIL, "Titan"); a match on
#                     these alone is down-weighted (tag acronym_only) until confirmed
#   use_symbol_alias: false stops the NSE symbol itself being added as a strict alias
#   company_name / isin / bse_code: only needed for offline resolution
#
# Rule of thumb: every listed group company sharing a brand needs exclude_terms,
# otherwise its news leaks into the parent's sentiment (and vice versa).

RELIANCE:
  # The press usually writes plain "Reliance". It is matched case-sensitively, after
  # every other Reliance-branded or Ambani-group entity below has been masked out.
  aliases: [Reliance Industries, Mukesh Ambani, Reliance Retail, Reliance Jio, Jio Platforms]
  strict_aliases: [RIL, Reliance]
  ambiguous_aliases: [RIL]
  exclude_terms:
    - Reliance Power
    - Reliance Infrastructure
    - Reliance Infra
    - Reliance Capital
    - Reliance Home Finance
    - Reliance Communications
    - Reliance General Insurance
    - Reliance Health Insurance
    - Reliance Nippon
    - Reliance Mutual Fund
    - Reliance Securities
    - Reliance Naval
    - Reliance Defence
    - Reliance Entertainment
    - Reliance Group
    - Reliance ADA
    - Anil Ambani
    - Jio Financial Services
    - Jio Financial
    - Jio BlackRock

TCS:
  aliases: [Tata Consultancy Services, Tata Consultancy]
  strict_aliases: [TCS]
  # Sponsorships and CSR carry the brand but no business news.
  exclude_terms:
    - Jaguar TCS Racing
    - TCS Foundation
    - TCS World 10K
    - TCS London Marathon
    - TCS New York City Marathon
    - TCS Sydney Marathon
    - TCS Amsterdam Marathon
    - TCS Toronto Waterfront Marathon

INFY:
  aliases: [Infosys]
  strict_aliases: [INFY]

HDFCBANK:
  aliases: [HDFC Bank]
  exclude_terms: [HDFC Life, HDFC AMC, HDFC Asset Management, HDFC Securities, HDFC ERGO, HDFC Mutual Fund]

ICICIBANK:
  aliases: [ICICI Bank]
  exclude_terms: [ICICI Prudential, ICICI Lombard, ICICI Securities, ICICI Direct]

SBIN:
  aliases: [State Bank of India]
  strict_aliases: [SBI]
  exclude_terms: [SBI Life, SBI Cards, SBI Card, SBI Mutual Fund, SBI General, SBI Funds Management]
  use_symbol_alias: false

LT:
  aliases: [Larsen & Toubro, Larsen and Toubro]
  strict_aliases: [L&T]
  exclude_terms: [L&T Finance, L&T Technology Services, LTIMindtree, L&T Mutual Fund]
  use_symbol_alias: false

M&M:
  # The press usually writes plain "Mahindra". It is matched case-sensitively, after
  # the other listed Mahindra-named companies below have been masked out.
  aliases: [Mahindra & Mahindra, Mahindra and Mahindra, Anand Mahindra]
  strict_aliases: [M&M, Mahindra]
  exclude_terms:
    - Mahindra & Mahindra Financial
    - Mahindra and Mahindra Financial
    - M&M Financial
    - M&M Finance
    - Mahindra Finance
    - Tech Mahindra
    - Kotak Mahindra
    - Mahindra Lifespace
    - Mahindra Logistics
    - Mahindra Holidays
    - Mahindra CIE
    - Mahindra Susten

ITC:
  aliases: [ITC Ltd, ITC Limited]
  strict_aliases: [ITC]
  exclude_terms: [ITC Hotels]
  use_symbol_alias: false

BHARTIARTL:
  aliases: [Bharti Airtel, Airtel]
  exclude_terms: [Bharti Hexacom, Airtel Africa]

